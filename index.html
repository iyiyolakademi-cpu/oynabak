function isGoogleReviewHost(host){
  host=String(host||'').toLowerCase().replace(/\.$/,'');
  return host==='g.page'
    || host==='maps.app.goo.gl'
    || /(^|\.)google\.(com|com\.tr|[a-z]{2}|co\.[a-z]{2})$/.test(host);
}
function normalizeReviewUrl(raw){
  const value=String(raw||'').trim();
  if(!value)return '';
  let u;
  try{u=new URL(value)}catch{throw Error('Google değerlendirme bağlantısı geçerli bir URL olmalı.')}
  if(u.protocol!=='https:'||!isGoogleReviewHost(u.hostname)){
    throw Error('Yalnızca güvenli Google değerlendirme bağlantısı kullanılabilir.');
  }
  u.hash='';
  return u.href;
}
function reviewUrl(){
  if(!venue?.review_url)return null;
  return normalizeReviewUrl(venue.review_url);
}
function openReviewPage(){
  let url='';
  try{url=reviewUrl()}catch(e){
    toast(e.message||'Google değerlendirme bağlantısı geçersiz.');
    return;
  }
  if(!url){
    toast('Bu işletme için Google değerlendirme bağlantısı henüz eklenmemiş.');
    return;
  }
  trackEvent('review_click').catch(()=>{});
  try{
    const w=window.open(url,'_blank','noopener,noreferrer');
    if(!w)location.href=url;
  }catch{
    location.href=url;
  }
}

}

function fileToLogoData(file){
  return new Promise((resolve,reject)=>{
    if(!file||!file.type.startsWith('image/')){reject(Error('Lütfen PNG, JPG veya WEBP bir görsel seç.'));return}
    const reader=new FileReader();
    reader.onerror=()=>reject(Error('Logo okunamadı.'));
    reader.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(Error('Logo görseli açılamadı.'));
      img.onload=()=>{
        const max=320;
        const scale=Math.min(1,max/img.width,max/img.height);
        const w=Math.max(1,Math.round(img.width*scale));
        const h=Math.max(1,Math.round(img.height*scale));
        const canvas=document.createElement('canvas');
        canvas.width=w;canvas.height=h;
        const ctx=canvas.getContext('2d');
        ctx.clearRect(0,0,w,h);
        ctx.drawImage(img,0,0,w,h);
        let data='';
        try{data=canvas.toDataURL('image/webp',.84)}catch{data=canvas.toDataURL('image/png')}
        if(data.length>420000){reject(Error('Logo çok büyük. Daha küçük bir görsel seç.'));return}
        resolve(data);
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function setupBrandEditor(v){
  const input=$('#venueLogoInput'),hidden=$('#venueLogoData'),preview=$('#venueLogoPreview'),remove=$('#venueLogoRemove');
  if(!input||!hidden||!preview)return;
  const draw=data=>{
    hidden.value=data||'';
    preview.innerHTML=data?`<img src="${esc(data)}" alt="Logo önizleme">`:'Logo yok';
  };
  draw(v?.logo_data||'');
  input.onchange=async()=>{
    const file=input.files?.[0];
    if(!file)return;
    input.disabled=true;
    try{draw(await fileToLogoData(file));}
    catch(e){toast(e.message)}
    finally{input.disabled=false;input.value=''}
  };
  if(remove)remove.onclick=()=>draw('');
  if(v?.id){
    rpc('ob_branding',{vid:v.id}).then(b=>{
      const data=b?.logo_data||'';
      v.logo_data=data;
      draw(data);
    }).catch(()=>{});
  }
}

function fileToGameImageData(file){
  return new Promise((resolve,reject)=>{
    if(!file||!file.type.startsWith('image/')){
      reject(Error('Lütfen PNG, JPG veya WEBP bir oyun görseli seç.'));
      return;
    }
    const reader=new FileReader();
    reader.onerror=()=>reject(Error('Oyun görseli okunamadı.'));
    reader.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(Error('Oyun görseli açılamadı.'));
      img.onload=()=>{
        const outW=960,outH=540;
        const canvas=document.createElement('canvas');
        canvas.width=outW;canvas.height=outH;
        const ctx=canvas.getContext('2d');
        const scale=Math.max(outW/img.width,outH/img.height);
        const sw=outW/scale,sh=outH/scale;
        const sx=(img.width-sw)/2,sy=(img.height-sh)/2;
        ctx.drawImage(img,sx,sy,sw,sh,0,0,outW,outH);
        let data='';
        try{data=canvas.toDataURL('image/webp',.82)}
        catch{data=canvas.toDataURL('image/jpeg',.84)}
        if(data.length>850000){
          reject(Error('Oyun görseli çok büyük. Daha küçük bir görsel seç.'));
          return;
        }
        resolve(data);
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}
async function fetchGameMedia(ids){
  const clean=[...new Set((ids||[]).filter(Boolean).map(String))];
  if(!clean.length)return {};
  try{
    const data=await rpc('ob_game_media_many',{gids:clean});

function clampScore(v){v=Math.round(Number(v));return Number.isFinite(v)?Math.max(0,Math.min(100,v)):0}

function gameDisplayName(key,extraGames=[]){
  const raw=String(key??'').trim();
  if(!raw)return 'Oyun';

  const direct=gameNames[raw]||gameNames[raw.toLocaleLowerCase('tr-TR')];
  if(direct)return direct;

  const customMatch=raw.match(/^(?:custom:)?(.+)$/);
  const id=customMatch?String(customMatch[1]).trim():'';

  const pools=[
    Array.isArray(extraGames)?extraGames:[],
    adminData?.games,
    me?.venue?.games,
    venue?.games
  ].filter(Array.isArray);

  // First try exact custom game ID against every catalog we currently have.
  if(raw.startsWith('custom:')){
    const customId=raw.slice(7).trim();
    for(const pool of pools){
      const g=pool.find(x=>String(x?.id??'')===String(customId));
      if(g?.name)return String(g.name);
    }
    return 'Oyun';
  }

  // Some older rows may have stored only the raw game id.
  for(const pool of pools){
    const g=pool.find(x=>String(x?.id??'')===id);
    if(g?.name)return String(g.name);
  }

  // Keep unknown historical built-in keys readable instead of "Özel oyun".
  return raw.replace(/^custom:/,'')||'Oyun';
}

function sendStorageResult(state,requestId,ok,value=null){
  try{

      source:GAME_BRIDGE_HOST,

function handleGameStorage(state,type,payload){
  const requestId=payload?.requestId,key=gameStorageKey(state,payload?.key);
  if(!requestId||!key){sendStorageResult(state,requestId,false,null);return}
  try{
    if(type==='storage-get'){
      const raw=localStorage.getItem(key);
      let value=null;
      if(raw!==null){try{value=JSON.parse(raw)}catch{value=raw}}
      sendStorageResult(state,requestId,true,value);
      return;
    }
    if(type==='storage-set'){
      const raw=JSON.stringify(payload?.value);
      if(raw.length>20000){sendStorageResult(state,requestId,false,null);return}
      localStorage.setItem(key,raw);
      sendStorageResult(state,requestId,true,true);
      return;
    }
    if(type==='storage-remove'){
      localStorage.removeItem(key);
      sendStorageResult(state,requestId,true,true);
    }
  }catch(e){
    console.warn('Oyun storage işlemi yapılamadı:',e?.message||e);
    sendStorageResult(state,requestId,false,null);
  }
}

  const winner=String(payload.winner??state.winner??'').trim().slice(0,80);

}

async function loadAnalyticsGameCatalog(id){
  const merged=new Map();
  const add=list=>{
    if(!Array.isArray(list))return;
    list.forEach(g=>{
      const gid=String(g?.id??'').trim();
      const name=String(g?.name??'').trim();
      if(gid&&name)merged.set(gid,{...g,id:gid,name});
    });
  };

  add(adminData?.games);
  add(me?.venue?.games);
  add(venue?.games);

  try{
    const publicVenue=await rpc('ob_customer',{vid:String(id)});
    add(publicVenue?.games);
  }catch(e){
    console.warn('Analitik oyun adları alınamadı:',e?.message||e);
  }

  return [...merged.values()];
}

function qrParams(){
  const u=new URL(location.href);
  const venueId=String(u.searchParams.get('isletme')||'').trim();
  const rawTable=String(u.searchParams.get('masa')||'').trim();
  const table=/^\d+$/.test(rawTable)?Number(rawTable):NaN;
  return {venueId,table};
}
function customerTable(){
  const {table}=qrParams();
  return Number.isInteger(table)&&table>0?table:null;
}
function validateQrContext(v=venue){
  const {venueId,table}=qrParams();
  if(!venueId)throw Error('Geçerli bir işletme QR kodunu okutun.');
  if(!Number.isInteger(table)||table<1)throw Error('QR bağlantısında geçerli bir masa numarası bulunamadı.');
  if(v?.id&&String(v.id)!==venueId)throw Error('QR bağlantısı bu işletmeyle eşleşmiyor.');
  const maxTables=Number(v?.tables||0);
  if(Number.isFinite(maxTables)&&maxTables>0&&table>maxTables){
    throw Error('Bu masa numarası işletmede tanımlı değil.');
  }
  return {venueId,table};
}

window.addEventListener('hashchange',route);
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action],[data-tab],[data-game],[data-custom]');if(!b||b.disabled)return;try{if(b.dataset.tab){tab=b.dataset.tab;drawAdmin();return}if(b.dataset.game){const key=b.dataset.game;if(!hasQrGameAccess()){toast('Bu oyun yalnızca işletme QR koduyla açılır.');return}if(!venue||!venue.enabled.includes(key))return;await trackEvent('game_open',{game:key});if(embeddedGameBase64[key]){openEmbeddedGame(key);return}return}if(b.dataset.custom){if(!hasQrGameAccess()){toast('Bu oyun yalnızca işletme QR koduyla açılır.');return}const vid=String(venue?.id||qrParams().venueId||''),gid=b.dataset.custom,gmeta=venue.games.find(g=>String(g.id)===String(gid)),gname=gmeta?.name||'Oyun';if(!vid){toast('İşletme bağlantısı bulunamadı. QR kodunu yeniden okut.');return}await trackEvent('game_open',{game:'custom:'+gid});modal(gname,'<div id="customGame"><p style="padding:24px">Oyun yükleniyor…</p></div>');enterGameScreen();const token=++gameLoadSeq;try{const code=await rpc('ob_game',{vid,gid});if(token!==gameLoadSeq||!$('#modal').open)return;safeFrame(code,$('#customGame'),{gameId:gid,gameName:gname})}catch(error){if(token===gameLoadSeq){$('#customGame').innerHTML=`<div style="padding:24px;font:14px/1.5 system-ui;color:#fff;background:#111;min-height:100%"><b>Oyun yüklenemedi.</b><br>${esc(error?.message||'Bilinmeyen hata')}</div>`}}return}const a=b.dataset.action,id=b.dataset.id;if(a==='retry')await route();if(a==='close-game'){closeModal();return}if(a==='logout'){const {error}=await db.auth.signOut();if(error)throw error;me=null;adminData=null;await route()}if(a==='reset'){const email=$('#authForm [name=email]').value;if(!email)throw Error('Önce e-posta adresini yaz.');const redirect=new URL(location.href);redirect.search='?recovery=1';redirect.hash='';const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:redirect.href});if(error)throw error;toast('Hesabın varsa şifre yenileme bağlantısı gönderilecek.')}if(a==='venue-new')venueForm();if(a==='venue-edit')venueForm(getVenue(id));if(a==='merchant-edit')venueForm(me.venue,true);if(a==='game-new')gameForm();if(a==='game-edit')gameForm(adminData.games.find(g=>g.id===id));if(a==='preview-code')safeFrame($('#gameForm [name=code]').value,$('#codePreview'),{gameName:$('#gameForm [name=name]').value||'Önizleme',preview:true});if(a==='qr')qrView(id);if(a==='stats')await stats(id,7);if(a==='stats-period')await stats(id,Number(b.dataset.days||7));if(a==='games'){trackEvent('games_open');const box=$('#gameList');if(!box.innerHTML.trim())listGames();box.scrollIntoView({behavior:'smooth',block:'start'})}if(a==='quote'){trackEvent('quote_open');openQuotePremium()}if(a==='copy-quote')await copyQuote(b.dataset.quote||dailyQuote().text);if(a==='review')openReviewPage();}catch(err){toast(err.message)}});
document.addEventListener('submit',async e=>{const f=e.target;if(!['authForm','passwordForm','recoveryRequestForm','requestForm','venueForm','gameForm'].includes(f.id)&&!f.classList.contains('assignForm'))return;e.preventDefault();const button=e.submitter,mode=button?.value,d=new FormData(f);f.querySelectorAll('button').forEach(b=>b.disabled=true);try{if(f.id==='recoveryRequestForm'){const redirect=new URL(location.pathname,location.origin);redirect.search='?recovery=1';redirect.hash='';const {error}=await db.auth.resetPasswordForEmail(d.get('email').trim(),{redirectTo:redirect.href});if(error)throw error;toast('Hesabın varsa yeni bağlantı gönderilecek. En son gelen e-postayı aç.')}else if(f.id==='authForm'){const credentials={email:d.get('email').trim(),password:d.get('password')};let r;if(mode==='signup'){const u=new URL(location.href);u.search='';u.hash='panel';r=await db.auth.signUp({...credentials,options:{emailRedirectTo:u.href}})}else r=await db.auth.signInWithPassword(credentials);if(r.error)throw r.error;if(mode==='signup'&&!r.data.session){toast('E-postanı kontrol et ve hesabını doğrula. Ardından giriş yap.');return}await route()}else if(f.id==='passwordForm'){if(d.get('password')!==d.get('confirm_password'))throw Error('Şifreler aynı olmalı.');const {error}=await db.auth.updateUser({password:d.get('password')});if(error)throw error;recoveryMode=false;recoveryFailure=false;history.replaceState(null,'',location.pathname+'#panel');toast('Şifren güncellendi.');await route()}else if(f.id==='requestForm'){await rpc('ob_request',{business_name:d.get('business_name')});toast('İşletme talebin alındı.');await route()}else if(f.id==='venueForm'){const rawReview=String(d.get('review_url')||'').trim();const p={id:f.dataset.id,name:d.get('name'),color:d.get('color'),review_url:rawReview?normalizeReviewUrl(rawReview):'',tables:Number(d.get('tables'))};if(!Number.isInteger(p.tables)||p.tables<1||p.tables>500)throw Error('Masa sayısı 1 ile 500 arasında olmalı.');if(f.dataset.merchant!=='true')Object.assign(p,{sector:d.get('sector'),enabled:d.getAll('enabled'),active:d.has('active'),licensed:d.has('licensed')});await rpc(f.dataset.merchant==='true'?'ob_merchant_save':'ob_save_venue',{p});let logoWarn='';if(f.dataset.id){try{await rpc('ob_branding_save',{vid:f.dataset.id,logo:d.get('logo_data')||null})}catch(e){logoWarn=' Logo kaydı yapılamadı; branding SQL dosyasını Supabase’de çalıştır.';console.warn(e)}}closeModal();toast('İşletme kaydedildi.'+logoWarn);await route()}else if(f.id==='gameForm'){const payload={id:f.dataset.id,revision:Number(f.dataset.revision),name:d.get('name'),description:d.get('description'),code:d.get('code'),venue_ids:d.getAll('venue_ids'),published:d.has('published')};const saved=await rpc('ob_save_game',{p:payload});let gid=savedGameId(saved,f.dataset.id);if(!gid&&d.get('image_data')){try{const fresh=await rpc('ob_admin_data');const same=(fresh.games||[]).filter(x=>x.name===d.get('name')).sort((a,b)=>(Number(b.revision)||0)-(Number(a.revision)||0));gid=same[0]?.id||null}catch(_){}}let mediaWarn='';if(gid){try{await rpc('ob_game_media_save',{gid:String(gid),image:d.get('image_data')||null})}catch(e){mediaWarn=' Kapak resmi kaydedilemedi; oyun medya SQL dosyasını Supabase’de çalıştır.';console.warn(e)}}else if(d.get('image_data')){mediaWarn=' Oyun kaydedildi. Kapak resmi için oyunu tekrar Düzenle ekranından açıp Kaydet.'}closeModal();toast('Oyun kaydedildi.'+mediaWarn);await route()}else if(f.classList.contains('assignForm')){await rpc('ob_assign_account',{uid:f.dataset.id,vid:d.get('venue')||null,new_status:mode});toast('Hesap erişimi güncellendi.');await route()}}catch(err){toast(err.message)}finally{f.querySelectorAll('button').forEach(b=>b.disabled=false)}});
if(db)db.auth.onAuthStateChange(event=>{if(event==='PASSWORD_RECOVERY'){recoveryMode=true;recoveryFailure=false;setTimeout(()=>{history.replaceState(null,'',location.pathname+'?recovery=1#panel');route()},0)}if(event==='SIGNED_OUT'){me=null;adminData=null}});
route();
</script></body></html>
