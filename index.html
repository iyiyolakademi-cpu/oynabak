      <h2>1. Veri sahibi grupları</h2><p>OynaBak işletme hesabı oluşturan veya hesabı kullanan kişiler ile QR üzerinden müşteri deneyimini kullanan ziyaretçiler.</p>

      <h2>6. KVKK madde 11 kapsamındaki haklar</h2><p>İlgili kişiler; kişisel verilerinin işlenip işlenmediğini öğrenme, işlenmişse bilgi talep etme, işleme amacını ve amacına uygun kullanılıp kullanılmadığını öğrenme, aktarılan üçüncü kişileri bilme, şartları varsa düzeltme/silme/yok etme isteme, bu işlemlerin aktarılan kişilere bildirilmesini isteme, münhasıran otomatik sistemlerle analiz sonucu aleyhe bir sonuca itiraz etme ve kanuna aykırı işleme nedeniyle zararın giderilmesini talep etme haklarına sahiptir.</p>

    terms:{k:'KOŞULLAR',t:'Kullanım Koşulları',d:'OynaBak sitesinin, işletme panelinin ve QR müşteri deneyiminin kullanım esaslarını belirler.',body:`
      <h2>1. Hizmet</h2><p>OynaBak; işletmelerin müşterilerine QR kod üzerinden oyun, dijital menü, içerik ve değerlendirme yönlendirmeleri sunmasına yardımcı olan bir dijital hizmettir. Garson çağrısı, QR sipariş, adisyon ve ön muhasebe gibi operasyon modülleri yalnızca işletme bazında ayrıca etkinleştirildiğinde sunulur. Bu modüller üzerinden çevrim içi ödeme veya tahsilat yapılmaz. Özellikler paket ve sürüme göre değişebilir.</p>
      <h2>2. İşletme hesabı ve erişim</h2><p>İşletme hesabı kullanıcıları giriş bilgilerinin güvenliğinden ve hesap üzerinden yapılan işlemlerden sorumludur. Hesap yalnızca yetkilendirildiği işletme için kullanılmalıdır. Erişim; aktivasyon, lisans veya güvenlik gerekçeleriyle sınırlandırılabilir.</p>
      <h2>3. Ücret ve aktivasyon</h2><p>Geçerli ücret, teklif veya satış sayfasında belirtilir. Bu sürümde ödeme site içinde otomatik tahsil edilmeyebilir; aktivasyon ödeme kontrolünden sonra yapılabilir. Özel ticari koşullar ayrıca teklif/sözleşme ile belirlenebilir.</p>
      <h2>4. İşletmenin sorumlulukları</h2><ul><li>İşletme adı ve Google değerlendirme bağlantısı dahil girilen bilgilerin doğru ve yetkili olması,</li><li>QR kodlarının hukuka ve işletme kullanımına uygun yerleştirilmesi,</li><li>müşterileri yanıltıcı, hukuka aykırı veya başkasının haklarını ihlal eden içerik kullanılmaması,</li><li>hesabın yetkisiz üçüncü kişilerle paylaşılmaması.</li></ul>
      <h2>5. Oyunlar ve kullanıcı davranışı</h2><p>Oyunlar eğlence amaçlıdır. Kullanıcıların kendi aralarındaki oyun davranışları, sonuçları veya üçüncü taraf platformlarda yaptıkları paylaşımlar OynaBak’ın kontrolünde değildir. Özel oyun içerikleri ayrıca güncellenebilir veya kaldırılabilir.</p>
      <h2>6. Fikri haklar</h2><p>OynaBak markası, arayüzü, yazılımı ve OynaBak tarafından üretilen özgün içerikler üzerindeki haklar ilgili hak sahiplerine aittir. Açık izin olmadan hizmetin kaynak kodunun, tasarımının veya içeriklerinin ticari amaçla kopyalanması/yeniden satılması yasaktır; üçüncü taraf açık kaynak bileşenlerin kendi lisansları saklıdır.</p>
      <h2>7. Hizmet sürekliliği</h2><p>Bakım, altyapı arızası, internet bağlantısı, üçüncü taraf servis kesintisi veya güvenlik sebepleriyle hizmet geçici olarak etkilenebilir. Makul ölçüde süreklilik hedeflenir ancak kesintisiz çalışma garantisi verilmez.</p>
      <h2>8. Kötüye kullanım ve askıya alma</h2><p>Güvenliği bozma, otomatik/spam trafik üretme, başka işletmenin verisine yetkisiz erişmeye çalışma veya hizmeti hukuka aykırı kullanma halinde erişim sınırlandırılabilir veya askıya alınabilir.</p>
      <h2>9. Değişiklikler</h2><p>Ürün geliştikçe bu koşullar güncellenebilir. Önemli değişikliklerde güncel sürüm ve tarih bu sayfada yayımlanır.</p>
      <h2>10. Uygulanacak hukuk</h2><p>Tarafların emredici hakları saklı kalmak üzere hizmete ilişkin uyuşmazlıklarda Türkiye Cumhuriyeti hukuku uygulanır. Yetki ve çözüm yolu, tarafların niteliğine ve ilgili mevzuata göre belirlenir.</p>`},

function isGoogleReviewHost(host){
  host=String(host||'').toLowerCase().replace(/\.$/,'');
  return host==='g.page'
    || host==='maps.app.goo.gl'
    || /(^|\.)google\.(com|com\.tr|[a-z]{2}|co\.[a-z]{2})$/.test(host);
}
function normalizeReviewUrl(raw){
  const value=String(raw||'').trim();
  if(!value)return '';
  let u;
  try{u=new URL(value)}catch{throw Error('Google değerlendirme bağlantısı geçerli bir URL olmalı.')}
  if(u.protocol!=='https:'||!isGoogleReviewHost(u.hostname)){
    throw Error('Yalnızca güvenli Google değerlendirme bağlantısı kullanılabilir.');
  }
  u.hash='';
  return u.href;
}
function reviewUrl(){
  if(!venue?.review_url)return null;
  return normalizeReviewUrl(venue.review_url);
}
function reviewUrlSafe(){
  try{return reviewUrl()||''}catch{return ''}
}
function isInstagramHost(host){
  host=String(host||'').toLowerCase().replace(/\.$/,'');
  return host==='instagram.com'||host==='www.instagram.com';
}
function normalizeInstagramUrl(raw){
  const value=String(raw||'').trim();
  if(!value)return '';
  let u;
  try{u=new URL(value)}catch{throw Error('Instagram bağlantısı geçerli bir URL olmalı.')}
  if(u.protocol!=='https:'||!isInstagramHost(u.hostname)){
    throw Error('Yalnızca güvenli Instagram profil bağlantısı kullanılabilir.');
  }
  u.hash='';
  return u.href;
}
const FREED_INSTAGRAM_URL='https://www.instagram.com/freedizmir/';
function isFreedVenue(v){
  return /freed/i.test(String(v?.name||'').normalize('NFD').replace(/[\u0300-\u036f]/g,''));
}
function venueInstagramUrl(v){
  if(isFreedVenue(v))return FREED_INSTAGRAM_URL;
  return String(v?.instagram_url||'').trim();
}
function instagramUrl(){
  const raw=venueInstagramUrl(venue);
  return normalizeInstagramUrl(raw);
}
function openInstagramPage(){
  let url='';
  try{url=instagramUrl()}catch(e){toast(e.message||'Instagram bağlantısı geçersiz.');return;}
  if(!url){toast('Bu işletme için Instagram hesabı henüz eklenmemiş.');return;}
  // Tek tıklama, tek yönlendirme: yeni sekme ve ikinci pencere açılmaz.
  location.assign(url);
}
async function openReviewPage(){
  let url='';
  try{url=reviewUrl()}catch(e){
    toast(e.message||'Google değerlendirme bağlantısı geçersiz.');
    return;
  }
  if(!url){
    toast('Bu işletme için Google değerlendirme bağlantısı henüz eklenmemiş.');
    return;
  }
  await trackEvent('review_click');
  try{
    const w=window.open(url,'_blank','noopener,noreferrer');
    if(!w)location.href=url;
  }catch{
    location.href=url;
  }
}

function toast(m){$('#toast').textContent=m;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').textContent='',6500)}
function modal(title,html){leaveGameScreen();gameCleanup();gameCleanup=()=>{};$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;if(!$('#modal').open)$('#modal').showModal()}
function closeModal(){
  const state=activeCustomGame;
  if(state&&!state.finished&&state.startedAt){
    finishCustomGame(state,{auto:true,detectedBy:'modal-close'}).catch(err=>toast(err.message));
    return;
  }
  leaveGameScreen();
  gameCleanup();
  gameCleanup=()=>{};
  $('#modalBody').replaceChildren();
  $('#modal').close();
}
$('#closeModal').onclick=closeModal;$('#modal').addEventListener('cancel',e=>{e.preventDefault();closeModal()});

async function panel(seq){if(!db){authView();return}const {data:{session},error}=await db.auth.getSession();if(seq!==routeSeq)return;if(recoveryMode||recoveryFailure){recoveryView(Boolean(session)&&!error&&!recoveryFailure);return}if(error)throw error;if(!session){authView();return}me=await rpc('ob_me');if(seq!==routeSeq)return;
 if(me.role==='admin'){adminData=await rpc('ob_admin_data');if(seq!==routeSeq)return;adminGameMedia=await fetchGameMedia((adminData.games||[]).map(g=>g.id));(adminData.games||[]).forEach(g=>g.image_data=adminGameMedia[String(g.id)]?.image_data||'');if(seq!==routeSeq)return;drawAdmin();hydrateVenueCodes();obShowOwnerFinancePreview()}else if(me.role==='staff'){
  $('#app').innerHTML='<div class="wrap page"><div class="card"><h2>Personel çalışma alanınız açılıyor…</h2><p>İşletme yetkileriniz yükleniyor.</p></div></div>';
 }else{if(me?.venue?.id)await loadVenueFeatures(me.venue.id);drawMerchant(session.user.email);hydrateVenueCodes()}}
function panelTop(title){return `<div class="row" style="justify-content:space-between"><div><span class="eyebrow">OYNABAK PANEL</span><h2>${esc(title)}</h2></div><button data-action="logout" class="btn small light">Çıkış yap</button></div>`}
async function obShowOwnerFinancePreview(){
 try{
   if(me?.role!=='admin')return;
   const allowed=await rpc('ob_finance_owner_preview_allowed');
   if(allowed!==true)return;
   const v=(adminData?.venues||[]).find(x=>x.name==='İyi Yol Akademi');
   if(!v)return;
   const edit=document.querySelector('[data-action="venue-edit"][data-id="'+v.id+'"]');
   const card=edit?.closest('.card');
   if(!edit||!card||card.querySelector('[data-owner-finance-preview]'))return;
   const b=document.createElement('button');b.type='button';b.className='btn small light';
   b.setAttribute('data-owner-finance-preview','');b.textContent='💼 Ön Muhasebe';
   b.onclick=async event=>{
     event.preventDefault();
     event.stopPropagation();
     if(b.disabled)return;
     b.disabled=true;
     const oldText=b.textContent;
     b.textContent='Ön Muhasebe açılıyor…';
     try{
       if(!window.OynaBakOwnerFinancePreview?.open) throw Error('Finans ekranı yüklenemedi. Sayfayı yenileyin.');
       await window.OynaBakOwnerFinancePreview.open({db,me,venueId:v.id});
     }catch(error){
       console.error('Ön Muhasebe açılış hatası:',error);
       toast('Ön Muhasebe açılamadı: '+(error?.message||'Bilinmeyen hata'));
     }finally{
       b.disabled=false;b.textContent=oldText;
     }
   };
   edit.parentElement.appendChild(b);

const CURRENT_GAME_ORDER=[
  'Tabu',
  '2048',
  'Sudoku',
  'Doğruluk mu Cesaret mi?',
  'Refleks Düellosu',
  'Tavla',
  'Satranç',
  'Hızlı Matematik Düellosu',
  'Çengel Bulmaca',
  'Kimim Ben?'
];

function normalizeGameName(name){
  return String(name||'')
    .toLocaleLowerCase('tr-TR')
    .replace(/[?!.:,;'"()\-–—_/\\]+/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}

const CURRENT_GAME_KEYS=CURRENT_GAME_ORDER.map(normalizeGameName);

function currentTenGames(list){
  if(!Array.isArray(list))return [];

  // Aynı isimle birden fazla kayıt varsa en yüksek revision olanı kullan.
  // Eski 10 oyunun sırası korunur; panelden eklenen yeni oyunlar da
  // otomatik olarak listenin devamına eklenir. Artık 10 oyun sınırı yoktur.
  const best=new Map();

  for(const g of list){
    if(!g||!g.name)continue;

    const key=normalizeGameName(g.name);
    const prev=best.get(key);
    const rev=Number(g.revision||0);
    const prevRev=Number(prev?.revision||0);

    if(!prev||rev>prevRev){
      best.set(key,g);
      continue;
    }

    if(rev===prevRev){
      const t=Date.parse(g.updated_at||g.created_at||0)||0;
      const pt=Date.parse(prev.updated_at||prev.created_at||0)||0;
      if(t>pt)best.set(key,g);
    }
  }

  const games=[...best.values()];

  games.sort((a,b)=>{
    const aKey=normalizeGameName(a.name);
    const bKey=normalizeGameName(b.name);
    const ai=CURRENT_GAME_KEYS.indexOf(aKey);
    const bi=CURRENT_GAME_KEYS.indexOf(bKey);

    // Mevcut ana oyunlar kendi belirlenmiş sırasını korusun.
    if(ai!==-1&&bi!==-1)return ai-bi;
    if(ai!==-1)return -1;
    if(bi!==-1)return 1;

    // Panelden sonradan eklenen oyunları kayıt tarihine göre sırala.
    const at=Date.parse(a.created_at||a.updated_at||0)||0;
    const bt=Date.parse(b.created_at||b.updated_at||0)||0;
    if(at!==bt)return at-bt;

    return String(a.name||'').localeCompare(String(b.name||''),'tr-TR');
  });

  return games;
}

async function syncVenueCustomGames(venueId,selectedIds=[]){
  venueId=String(venueId||'').trim();
  if(!venueId)return;

  const selected=new Set((selectedIds||[]).map(String));
  const allowedIds=new Set(currentTenGames(adminData?.games||[]).map(g=>String(g.id)));

  // Tüm kayıtları dolaşıyoruz:
  // - seçilen güncel oyunları işletmeye ekle
  // - duplicate/eski oyun kayıtlarını aynı işletmeden kaldır
  const all=Array.isArray(adminData?.games)?adminData.games:[];
  for(const g of all){
    const gid=String(g?.id||'');
    if(!gid)continue;

    const before=(g.venue_ids||[]).map(String);
    const without=before.filter(x=>x!==venueId);
    const shouldAssign=allowedIds.has(gid)&&selected.has(gid);
    const after=shouldAssign?[...new Set([...without,venueId])]:without;

    if(before.length===after.length&&before.every((x,i)=>x===after[i]))continue;

    const payload={
      id:g.id,
      revision:Number(g.revision||0),
      name:g.name||'Oyun',
      description:g.description||'',
      code:g.code||'',
      venue_ids:after,
      published:Boolean(g.published)
    };

    await rpc('ob_save_game',{p:payload});
    g.venue_ids=after;
  }
}

// POS siparis bildirimi: tok, belirgin, cift tonlu zil.
// Ses kullanici etkilesimi ile acilir; bekleyen cagri susturulana veya tamamlanana kadar tekrarlar.
// Both Garson Çağırma and Sipariş Merkezi play this EXACT same original POS melody.
window.OynaBakPlayWaiterTone=function(ctx){
 if(!ctx||ctx.state!=='running')return false;
 try{
    const now=ctx.currentTime+.015;
    const master=ctx.createGain();
    master.gain.value=.95;
    master.connect(ctx.destination);
    // Original dual-strike POS notification: keep pitch, length and harmonics identical.
    [[0,.23],[.34,.27]].forEach(([offset,duration])=>{
      [[740,.44,'triangle'],[1110,.22,'sine'],[1480,.08,'sine']].forEach(([frequency,level,wave])=>{
        const osc=ctx.createOscillator(), gain=ctx.createGain();
        const start=now+offset, end=start+duration;
        osc.type=wave;osc.frequency.setValueAtTime(frequency,start);
        gain.gain.setValueAtTime(.0001,start);
        gain.gain.exponentialRampToValueAtTime(level,start+.012);
        gain.gain.exponentialRampToValueAtTime(level*.65,start+.08);
        gain.gain.exponentialRampToValueAtTime(.0001,end);
        osc.connect(gain);gain.connect(master);
        osc.start(start);osc.stop(end+.02);
      });
    });
    if(navigator.vibrate)navigator.vibrate([160,110,180]);
    setTimeout(()=>{try{master.disconnect()}catch(_){}},1000);
    return true;
 }catch(e){console.warn('POS alarm sesi çalınamadı:',e);return false}
};

}

function refreshWaiterAlarm(){
  const audible=waiterPendingCalls.filter(c=>c?.id&&!waiterMutedCalls.has(String(c.id)));
  if(!audible.length){
    stopWaiterAlarm();
    document.querySelector('.waiter-alert')?.remove();
    return;
  }
  if(waiterSoundEnabled&&!waiterAlarmActive)startWaiterAlarm();
  if(!document.querySelector('.waiter-alert'))showWaiterAlert(audible[audible.length-1]);
}
function muteWaiterCall(id){
  const key=String(id||'');
  if(!key)return;
  waiterMutedCalls.add(key);
  stopWaiterAlarm();
  document.querySelector('.waiter-alert')?.remove();
  refreshWaiterAlarm();
  toast('Bu masa çağrısının sesi kapatıldı.');
}
async function loadWaiterCalls({notifyNew=false}={}){
  const rows=await rpc('ob_waiter_list');
  const list=Array.isArray(rows)?rows:[];
  waiterPendingCalls=list;
  const activeIds=new Set(list.filter(c=>c?.id).map(c=>String(c.id)));
  for(const id of waiterMutedCalls){if(!activeIds.has(id))waiterMutedCalls.delete(id)}
  if(notifyNew){
    const fresh=list.filter(c=>c?.id&&!waiterKnownIds.has(String(c.id))&&!waiterMutedCalls.has(String(c.id)));
    if(fresh.length){
      const newest=fresh[fresh.length-1];
      startWaiterAlarm();
      showWaiterAlert(newest);
    }
  }
  waiterKnownIds=new Set(list.filter(c=>c?.id).map(c=>String(c.id)));
  refreshWaiterAlarm();
  const box=$('#waiterLiveList');if(!box)return;
  box.innerHTML=list.length?list.map(c=>`<div class="waiter-call new"><div><strong>Masa ${esc(c.table_no)} · ${esc(waiterRequestLabel(c.request_type))}</strong><small>${new Date(c.created_at).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})} · Bekliyor</small></div><button class="waiter-done" data-action="waiter-done" data-id="${esc(c.id)}">✓ Tamamlandı</button></div>`).join(''):'<div class="analytics-empty">Şu anda bekleyen çağrı yok.</div>';
}
function stopWaiterRealtime(){
  if(waiterChannel&&db){try{db.removeChannel(waiterChannel)}catch(_){}}
  waiterChannel=null;
  if(waiterPollTimer){clearInterval(waiterPollTimer);waiterPollTimer=null}
  stopWaiterAlarm();
}
async function startWaiterRealtime(){
  setTimeout(updateWaiterSoundButton,0);
  stopWaiterRealtime();
  const vid=String(me?.venue?.id||'');if(!vid||!db)return;
  waiterChannel=db.channel('waiter-'+vid)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'waiter_calls',filter:'venue_id=eq.'+vid},payload=>{
      const c=payload.new||{};
      if(c?.id)waiterKnownIds.add(String(c.id));
      if(c?.id&&!waiterMutedCalls.has(String(c.id))){waiterPendingCalls.push(c);startWaiterAlarm();showWaiterAlert(c)}
      loadWaiterCalls().catch(()=>{});
    })
    .subscribe();
  // Realtime tarayıcı/telefon tarafından askıya alınırsa çağrı kaybolmasın:
  // 3 saniyelik yedek kontrol de çalışır.
  waiterPollTimer=setInterval(()=>loadWaiterCalls({notifyNew:true}).catch(()=>{}),3000);
}

function fileToGameImageData(file){
  return new Promise((resolve,reject)=>{
    if(!file||!file.type.startsWith('image/')){
      reject(Error('Lütfen PNG, JPG veya WEBP bir oyun görseli seç.'));
      return;
    }
    const reader=new FileReader();
    reader.onerror=()=>reject(Error('Oyun görseli okunamadı.'));
    reader.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(Error('Oyun görseli açılamadı.'));
      img.onload=()=>{
        const outW=960,outH=540;
        const canvas=document.createElement('canvas');
        canvas.width=outW;canvas.height=outH;
        const ctx=canvas.getContext('2d');
        const scale=Math.max(outW/img.width,outH/img.height);
        const sw=outW/scale,sh=outH/scale;
        const sx=(img.width-sw)/2,sy=(img.height-sh)/2;
        ctx.drawImage(img,sx,sy,sw,sh,0,0,outW,outH);
        let data='';
        try{data=canvas.toDataURL('image/webp',.82)}
        catch{data=canvas.toDataURL('image/jpeg',.84)}
        if(data.length>850000){
          reject(Error('Oyun görseli çok büyük. Daha küçük bir görsel seç.'));
          return;
        }
        resolve(data);
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function setupGameImageEditor(g){

  const preview=$('#gameImagePreview');
  const remove=$('#gameImageRemove');

  let userChangedImage=false;

  const draw=data=>{
    hidden.value=data||'';
    preview.innerHTML=data
      ? `<img src="${esc(data)}" alt="Oyun kapak görseli önizleme">`
      : 'Henüz görsel seçilmedi';

  draw(g?.image_data||'');

    const file=input.files?.[0];
    if(!file)return;

  if(remove)remove.onclick=()=>{

  if(g?.id){
    rpc('ob_game_media',{gid:String(g.id)}).then(m=>{
      if(userChangedImage)return;
      const data=m?.image_data||'';
      g.image_data=data;
      draw(data);
    }).catch(e=>console.warn('Oyun resmi alınamadı:',e?.message||e));
  }
}
function savedGameId(saved,fallback){
  // ob_save_game UUID döndürüyorsa her zaman önce onu kullan.
  // Böylece yeni kayıt ve güncellemelerde kapak resmi doğru oyuna yazılır.
  if(typeof saved==='string'&&saved.trim())return saved.trim();
  if(saved&&typeof saved==='object'){
    const id=String(saved.id||saved.game_id||saved.gameId||'').trim();
    if(id)return id;
  }
  return fallback?String(fallback):null;
}

async function saveGameSafely(payload){
  // The database RPC MUST save game and image in one PostgreSQL transaction.
  // No fallback to the legacy two-call sequence: partial saves are unsafe.
  const result=await rpc('ob_save_game_atomic',{p:payload});
  const id=savedGameId(result,null);
  if(!id)throw Error('Sunucu kesin oyun kimliği döndürmedi. İşlem doğrulanamadı.');
  if(payload.id&&String(id)!==String(payload.id))throw Error('Sunucu farklı oyun kimliği döndürdü.');
  return {id,revision:result?.revision??null};
}

function gameDisplayName(key,extraGames=[]){
  const raw=String(key??'').trim();
  if(!raw)return 'Oyun';

  const direct=legacyGameNames[raw]||legacyGameNames[raw.toLocaleLowerCase('tr-TR')];
  if(direct)return direct;

  const customMatch=raw.match(/^(?:custom:)?(.+)$/);
  const id=customMatch?String(customMatch[1]).trim():'';

  const pools=[
    Array.isArray(extraGames)?extraGames:[],
    adminData?.games,
    me?.venue?.games,
    venue?.games
  ].filter(Array.isArray);

  // First try exact custom game ID against every catalog we currently have.
  if(raw.startsWith('custom:')){
    const customId=raw.slice(7).trim();
    for(const pool of pools){
      const g=pool.find(x=>String(x?.id??'')===String(customId));
      if(g?.name)return String(g.name);
    }
    return 'Oyun';
  }

  // Some older rows may have stored only the raw game id.
  for(const pool of pools){
    const g=pool.find(x=>String(x?.id??'')===id);
    if(g?.name)return String(g.name);
  }

  // Keep unknown historical built-in keys readable instead of "Özel oyun".
  return raw.replace(/^custom:/,'')||'Oyun';
}

  }catch(_){}

  function friendlyRuntimeError(detail){

<\/script>`;

  const injected=security+bridge;

  // Tam HTML belgesi geldiyse ikinci bir html/body içine gömme.
  if(/<!doctype\s+html|<html[\s>]/i.test(src)){

function instrumentGameFinish(code){
  let src=String(code||'');

  // Yaygın gerçek oyun-bitiş fonksiyonlarına doğrudan OynaBak.finish ekle.
  // Böylece metin algılamaya bağlı kalmaz.
  const names=[
    'finishGame','endGame','gameOver','finishMatch','endMatch',
    'finishRound','endRound','completeGame','completeMatch',
    'showGameOver','showFinal','showFinalScreen','showWinner',
    'declareWinner','finishRace','endRace','finishTournament'
  ];

  for(const name of names){
    // function finishGame(...) { ... }
    const decl=new RegExp('(function\\\\s+'+name+'\\\\s*\\\\([^)]*\\\\)\\\\s*\\\\{)','g');
    src=src.replace(decl, `$1
try{window.OynaBak?.finish({auto:true,detectedBy:'${name}'});}catch(_){}
`);

    // const finishGame = (...) => { ... } / finishGame = function(...) { ... }
    const arrow=new RegExp('((?:const|let|var)\\\\s+'+name+'\\\\s*=\\\\s*(?:async\\\\s*)?\\\\([^)]*\\\\)\\\\s*=>\\\\s*\\\\{)','g');
    src=src.replace(arrow, `$1
try{window.OynaBak?.finish({auto:true,detectedBy:'${name}'});}catch(_){}
`);

    const fnAssign=new RegExp('('+name+'\\\\s*=\\\\s*(?:async\\\\s*)?function\\\\s*\\\\([^)]*\\\\)\\\\s*\\\\{)','g');
    src=src.replace(fnAssign, `$1
try{window.OynaBak?.finish({auto:true,detectedBy:'${name}'});}catch(_){}
`);
  }

  return src;
}

function sendStorageResult(state,requestId,ok,value=null){
  try{
    state?.frame?.contentWindow?.postMessage({
      source:GAME_BRIDGE_HOST,
      version:GAME_BRIDGE_VERSION,
      type:'storage-result',
      payload:{requestId:String(requestId||''),ok:Boolean(ok),value}
    },'*');
  }catch(_){}
}
function handleGameStorage(state,type,payload){
  const requestId=payload?.requestId,key=gameStorageKey(state,payload?.key);
  if(!requestId||!key){sendStorageResult(state,requestId,false,null);return}
  try{
    if(type==='storage-get'){
      const raw=localStorage.getItem(key);
      let value=null;
      if(raw!==null){try{value=JSON.parse(raw)}catch{value=raw}}
      sendStorageResult(state,requestId,true,value);
      return;
    }
    if(type==='storage-set'){
      const raw=JSON.stringify(payload?.value);
      if(raw.length>20000){sendStorageResult(state,requestId,false,null);return}
      localStorage.setItem(key,raw);
      sendStorageResult(state,requestId,true,true);
      return;
    }
    if(type==='storage-remove'){
      localStorage.removeItem(key);
      sendStorageResult(state,requestId,true,true);
    }
  }catch(e){
    console.warn('Oyun storage işlemi yapılamadı:',e?.message||e);
    sendStorageResult(state,requestId,false,null);
  }
}

async function finishCustomGame(state,payload={}){
  if(!state||state.finished)return;
  state.finished=true;

  const score=clampScore(payload.score??state.lastScore);
  const players=clampPlayers(payload.players??state.players);
  const winner=String(payload.winner??state.winner??'').trim().slice(0,80);
  const duration=state.startedAt?Math.max(0,Math.round((Date.now()-state.startedAt)/1000)):0;
  const scoreKey=state.scoreKey||('custom:'+state.gameId);
  const gameName=state.gameName;
  const replayType=state.builtinKey?'game':'custom';
  const replayId=state.builtinKey||state.gameId;

  activeCustomGame=null;

  showGameFinishScreen({
    gameName,
    score,
    winner,
    players,
    duration,
    replayType,
    replayId
  });

  // A sandboxed iframe can claim any score. Treat it as untrusted display-only
  // data. Never send it to ob_score or game_finish analytics as verified.
  // To enable verified scores, implement a server-authoritative game engine
  // with server-side session, rules, move validation, and replay protection.
  if(!venue?.demo){
    console.info('[OynaBak] Oyun tamamlandı; istemci puanı doğrulanmadığı için kaydedilmedi.',{
      game:scoreKey, claimedScore:score, duration
    });
  }
}

function normalizeMenu(raw){
  const src=raw&&typeof raw==='object'?raw:{};
  const categories=Array.isArray(src.categories)?src.categories:[];
  return {categories:categories.slice(0,40).map((c,ci)=>({
    id:String(c?.id||('cat-'+ci)),
    name:String(c?.name||'Kategori').slice(0,80),
    active:c?.active!==false,
    station:['kitchen','bar'].includes(c?.station)?c.station:'auto',
    subcategories:(Array.isArray(c?.subcategories)?c.subcategories:[]).slice(0,30).map((sub,si)=>({
      id:String(sub?.id||('sub-'+ci+'-'+si)).slice(0,120),
      name:String(sub?.name||'Alt başlık').slice(0,80)
    })),
    items:(Array.isArray(c?.items)?c.items:[]).slice(0,100).map((it,ii)=>({
      id:String(it?.id||('item-'+ii)),subcategory_id:String(it?.subcategory_id||'').slice(0,120),name:String(it?.name||'Ürün').slice(0,120),description:String(it?.description||'').slice(0,300),
      price:Number(it?.price||0),image_url:String(it?.image_url||'').slice(0,1200),image_data:String(it?.image_data||'').slice(0,900000),active:it?.active!==false,sold_out:Boolean(it?.sold_out),featured:Boolean(it?.featured),station:['kitchen','bar'].includes(it?.station)?it.station:'auto',variants:(Array.isArray(it?.variants)?it.variants:[]).slice(0,30).map(v=>({id:String(v?.id||menuId('var')),name:String(v?.name||'').slice(0,100),price:Number(v?.price||0)}))
    }))
  }))};
}
function menuId(prefix='m'){try{return prefix+'-'+crypto.randomUUID()}catch{return prefix+'-'+Date.now()+'-'+Math.random().toString(36).slice(2)}}
function formatPrice(v){const n=Number(v||0);return new Intl.NumberFormat('tr-TR',{minimumFractionDigits:Number.isInteger(n)?0:2,maximumFractionDigits:2}).format(n)+' TL'}
function isCafeSector(sector){const x=String(sector||'').toLocaleLowerCase('tr-TR');return x.includes('kafe')||x.includes('cafe')||x.includes('café')}

function menuPublicGroupedItemsHtml(c){

  const subs=(c.subcategories||[]).filter(sub=>sub.name.trim());
  if(!subs.length)return `<div class="menu-items menu-list">${menuPublicRowsHtml(items)}</div>`;
  const ids=new Set(subs.map(sub=>sub.id));
  const sections=subs.map(sub=>{
    const products=items.filter(i=>i.subcategory_id===sub.id);
    if(!products.length)return '';
    return `<section class="menu-subgroup" aria-label="${esc(sub.name)}">
      <h4 class="menu-subgroup-title">${esc(sub.name)}</h4>
      <div class="menu-items menu-list">${menuPublicRowsHtml(products)}</div>
    </section>`;
  }).join('');
  const other=items.filter(i=>!i.subcategory_id||!ids.has(i.subcategory_id));
  return sections+(other.length?`<section class="menu-subgroup" aria-label="Diğer Ürünler">
    <h4 class="menu-subgroup-title">Diğer Ürünler</h4>
    <div class="menu-items menu-list">${menuPublicRowsHtml(other)}</div>
  </section>`:'');
}

function qrParams(){const u=new URL(location.href);return {venueId:String(u.searchParams.get('isletme')||'').trim(),table:1}}
function customerTable(){try{const id=String(venue?.id||qrParams().venueId||'');const n=Number(localStorage.getItem('oynabak_table_'+id));return Number.isInteger(n)&&n>=1&&n<=1000?n:0}catch(_){return 0}}
function validateQrContext(v=venue){const {venueId}=qrParams();if(!venueId)throw Error('Önce işletme kodunu gir.');if(v?.id&&String(v.id)!==venueId)throw Error('İşletme bağlantısı eşleşmiyor.');return {venueId,table:1}}
function eventKey(prefix){try{return prefix+':'+crypto.randomUUID()}catch{return prefix+':'+Date.now()+':'+Math.random().toString(36).slice(2)}}
async function trackEvent(et,{game=null,score=null,key=null}={}){
  const vid=String(venue?.id||qrParams().venueId||'').trim();
  if(!venue||venue.demo||!vid||!db)return false;
  try{
    const ok=await rpc('ob_event_v3',{
      vid,
      et:String(et||'').trim(),
      t:customerTable(),
      k:key||eventKey(et),
      g:game==null?null:String(game).slice(0,140),
      s:score==null?null:clampScore(score)
    });
    if(ok===false)console.warn('[OynaBak Analytics] Olay reddedildi:',et,vid);
    return ok!==false;
  }catch(e){
    console.error('[OynaBak Analytics] Olay kaydedilemedi:',et,e?.message||e);
    return false;
  }
}
