function gameBridgeCode(){return `<script>(function(){'use strict';const SOURCE='${GAME_BRIDGE_SOURCE}',HOST='${GAME_BRIDGE_HOST}',VERSION=${GAME_BRIDGE_VERSION};let context=null;const initHandlers=[];function send(type,payload){parent.postMessage({source:SOURCE,version:VERSION,type:type,payload:payload||{}},'*')}async function requestFS(){try{const el=document.documentElement;if(el.requestFullscreen){await el.requestFullscreen();return true}}catch(e){}send('fullscreen');return false}async function exitFS(){try{if(document.fullscreenElement&&document.exitFullscreen){await document.exitFullscreen();return true}}catch(e){}send('exitFullscreen');return false}window.OynaBak={version:VERSION,get context(){return context},get isFullscreen(){return Boolean(document.fullscreenElement)},onInit(fn){if(typeof fn!=='function')return;if(context)fn(context);else initHandlers.push(fn)},ready(){send('ready')},start(data){send('start',data||{})},score(value,data){send('score',Object.assign({},data||{},{score:value}))},finish(data){send('finish',data||{})},expand(){send('expand')},collapse(){send('collapse')},fullscreen(){return requestFS()},exitFullscreen(){return exitFS()},toggleFullscreen(){send('expand');return true}};addEventListener('message',function(event){const d=event.data;if(!d||d.source!==HOST||d.version!==VERSION||d.type!=='init')return;context=d.context||{};while(initHandlers.length){try{initHandlers.shift()(context)}catch(e){}}});window.OynaBak.ready();})();<\/script>`}

window.addEventListener('message',async e=>{const d=e.data,state=activeCustomGame;if(!state||e.source!==state.frame.contentWindow||!d||d.source!==GAME_BRIDGE_SOURCE||d.version!==GAME_BRIDGE_VERSION)return;const p=d.payload&&typeof d.payload==='object'?d.payload:{};if(d.type==='ready'){sendGameInit(state);return}if(d.type==='expand'){enterGameScreen();return}if(d.type==='collapse'){exitGameScreen();return}if(d.type==='fullscreen'){enterGameScreen();try{if(!document.fullscreenElement&&document.documentElement.requestFullscreen){await document.documentElement.requestFullscreen();ownsFullscreen=true}}catch{}return}if(d.type==='exitFullscreen'){try{if(document.fullscreenElement)await document.exitFullscreen();ownsFullscreen=false}catch{}return}if(d.type==='start'){state.players=clampPlayers(p.players??state.players);state.startedAt=Date.now();state.finished=false;return}if(d.type==='score'){state.lastScore=clampScore(p.score);if(p.players!=null)state.players=clampPlayers(p.players);if(p.winner!=null)state.winner=String(p.winner).slice(0,80);return}if(d.type==='finish'){if(p.players!=null)state.players=clampPlayers(p.players);if(p.winner!=null)state.winner=String(p.winner).slice(0,80);finishCustomGame(state,p).catch(err=>toast(err.message))}});

function playMemory(){modal('Hafıza Kartları','<div class="game-board"><p>Aynı simgeleri bul. Daha az hamle, daha yüksek puan!</p><b id="moves">Hamle: 0</b><div class="memory" id="memory"></div></div>');const cards=shuffle(['🍋','🍇','🍒','🥝','🍉','🍓'].flatMap(x=>[x,x]));let open=[],done=new Set(),moves=0,locked=false,timer;gameCleanup=()=>clearTimeout(timer);const b=$('#memory');b.innerHTML=cards.map((_,i)=>`<button data-card="${i}" aria-label="Kapalı kart ${i+1}">?</button>`).join('');b.onclick=e=>{const el=e.target.closest('[data-card]');if(!el||locked)return;const i=Number(el.dataset.card);if(done.has(i)||open.includes(i))return;el.textContent=cards[i];el.setAttribute('aria-label',cards[i]);open.push(i);if(open.length===2){moves++;$('#moves').textContent='Hamle: '+moves;locked=true;const [a,c]=open;timer=setTimeout(()=>{if(cards[a]===cards[c]){done.add(a);done.add(c);[a,c].forEach(n=>b.children[n].disabled=true)}else{[a,c].forEach(n=>{b.children[n].textContent='?';b.children[n].setAttribute('aria-label','Kapalı kart '+(n+1))})}open=[];locked=false;if(done.size===cards.length)finishGame('memory',Math.max(10,100-(moves-6)*5))},650)}}}
function playWord(){modal('Kelime Avı','<div class="game-board" id="wordBoard"></div>');const [word,hint]=shuffle([['KAHVE','Molaların sıcak eşlikçisi'],['KİTAP','Sayfalar arasında bir yolculuk'],['DENİZ','Mavi, tuzlu ve dalgalı'],['BİSİKLET','İki tekerlekli ulaşım aracı'],['ARKADAŞ','Güzel anları paylaştığın kişi'],['GÜNEŞ','Günümüzü aydınlatan yıldız'],['MÜZİK','Notaların dili'],['ÇİÇEK','Bahçenin renkli misafiri']])[0];const used=new Set();let wrong=0,timer,ended=false;gameCleanup=()=>clearTimeout(timer);function draw(){const won=[...word].every(c=>used.has(c));$('#wordBoard').innerHTML=`<p>${hint}</p><div class="word">${[...word].map(c=>used.has(c)||wrong>=6?c:'_').join(' ')}</div><p>Kalan hata hakkı: ${6-wrong}</p><div class="keyboard">${[...'ABCÇDEFGĞHIİJKLMNOÖPRSŞTUÜVYZ'].map(c=>`<button data-letter="${c}" ${used.has(c)||won||wrong>=6?'disabled':''}>${c}</button>`).join('')}</div>`;if(won||wrong>=6){ended=true;const p=document.createElement('p');p.textContent=won?'Kelimeyi buldun!':'Aradığımız kelime: '+word;$('#wordBoard').append(p);timer=setTimeout(()=>finishGame('word',won?Math.max(20,100-wrong*15):0),1400)}}$('#wordBoard').onclick=e=>{const b=e.target.closest('[data-letter]');if(!b||b.disabled||ended)return;const c=b.dataset.letter;used.add(c);if(!word.includes(c))wrong++;draw()};draw()}
async function route(){const seq=++routeSeq;closeModal();const hash=location.hash.slice(1);$('#app').innerHTML='<div class="wrap page"><p class="muted">Yükleniyor…</p></div>';try{if(recoveryMode||recoveryFailure||hash==='panel'||new URL(location.href).searchParams.has('recovery'))await panel(seq);else if(hash==='demo')await customer(true,seq);else if(hash==='play'||(!hash&&new URL(location.href).searchParams.has('isletme')))await customer(false,seq);else{home();if(hash==='features'||hash==='faq'||hash==='pricing')requestAnimationFrame(()=>document.getElementById(hash)?.scrollIntoView({behavior:'smooth'}))}}catch(e){if(seq===routeSeq)$('#app').innerHTML=`<div class="wrap page"><div class="notice">${esc(e.message)}</div><button class="btn light" data-action="retry">Tekrar dene</button> <a href="${esc(location.pathname)}" class="btn light">Ana sayfa</a></div>`}}
window.addEventListener('hashchange',route);
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action],[data-tab],[data-game],[data-custom]');if(!b||b.disabled)return;try{if(b.dataset.tab){tab=b.dataset.tab;drawAdmin();return}if(b.dataset.game){if(!venue||!venue.enabled.includes(b.dataset.game))return;({quiz:playQuiz,memory:playMemory,word:playWord})[b.dataset.game]?.();enterGameScreen();return}if(b.dataset.custom){const vid=venue.id,gid=b.dataset.custom,gmeta=venue.games.find(g=>g.id===gid),gname=gmeta?.name||'Oyun';modal(gname,'<div id="customGame"><p style="padding:24px">Oyun yükleniyor…</p></div>');enterGameScreen();const token=++gameLoadSeq;try{const code=await rpc('ob_game',{vid,gid});if(token!==gameLoadSeq||!$('#modal').open)return;safeFrame(code,$('#customGame'),{gameId:gid,gameName:gname})}catch(error){if(token===gameLoadSeq)$('#customGame').textContent='Oyun yüklenemedi: '+error.message}return}const a=b.dataset.action,id=b.dataset.id;if(a==='retry')await route();if(a==='close-game'){closeModal();return}if(a==='logout'){const {error}=await db.auth.signOut();if(error)throw error;me=null;adminData=null;await route()}if(a==='reset'){const email=$('#authForm [name=email]').value;if(!email)throw Error('Önce e-posta adresini yaz.');const redirect=new URL(location.href);redirect.search='?recovery=1';redirect.hash='';const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:redirect.href});if(error)throw error;toast('Hesabın varsa şifre yenileme bağlantısı gönderilecek.')}if(a==='venue-new')venueForm();if(a==='venue-edit')venueForm(getVenue(id));if(a==='merchant-edit')venueForm(me.venue,true);if(a==='game-new')gameForm();if(a==='game-edit')gameForm(adminData.games.find(g=>g.id===id));if(a==='preview-code')safeFrame($('#gameForm [name=code]').value,$('#codePreview'),{gameName:$('#gameForm [name=name]').value||'Önizleme',preview:true});if(a==='qr')qrView(id);if(a==='stats')await stats(id);if(a==='games')listGames();if(a==='quote')modal('Günün sözü',`<div class="game-board"><span class="icon">☀</span><h2>${quotes[Math.floor(Date.now()/86400000)%quotes.length]}</h2><p class="muted">OynaBak · Küçük molalar, güzel anlar.</p></div>`);if(a==='review'){if(venue.demo)toast('Gerçek işletmede bu düğme Google değerlendirme sayfasını açar.');else if(!venue.review_url)toast('İşletme henüz değerlendirme bağlantısı eklememiş.');else{const u=new URL(venue.review_url);if(u.protocol!=='https:'||!['g.page','maps.app.goo.gl','www.google.com','google.com','maps.google.com'].includes(u.hostname))throw Error('Geçersiz değerlendirme bağlantısı.');window.open(u.href,'_blank','noopener,noreferrer')}}}catch(err){toast(err.message)}});
document.addEventListener('submit',async e=>{const f=e.target;if(!['authForm','passwordForm','recoveryRequestForm','requestForm','venueForm','gameForm'].includes(f.id)&&!f.classList.contains('assignForm'))return;e.preventDefault();const button=e.submitter,mode=button?.value,d=new FormData(f);f.querySelectorAll('button').forEach(b=>b.disabled=true);try{if(f.id==='recoveryRequestForm'){const redirect=new URL(location.pathname,location.origin);redirect.search='?recovery=1';redirect.hash='';const {error}=await db.auth.resetPasswordForEmail(d.get('email').trim(),{redirectTo:redirect.href});if(error)throw error;toast('Hesabın varsa yeni bağlantı gönderilecek. En son gelen e-postayı aç.')}else if(f.id==='authForm'){const credentials={email:d.get('email').trim(),password:d.get('password')};let r;if(mode==='signup'){const u=new URL(location.href);u.search='';u.hash='panel';r=await db.auth.signUp({...credentials,options:{emailRedirectTo:u.href}})}else r=await db.auth.signInWithPassword(credentials);if(r.error)throw r.error;if(mode==='signup'&&!r.data.session){toast('E-postanı kontrol et ve hesabını doğrula. Ardından giriş yap.');return}await route()}else if(f.id==='passwordForm'){if(d.get('password')!==d.get('confirm_password'))throw Error('Şifreler aynı olmalı.');const {error}=await db.auth.updateUser({password:d.get('password')});if(error)throw error;recoveryMode=false;recoveryFailure=false;history.replaceState(null,'',location.pathname+'#panel');toast('Şifren güncellendi.');await route()}else if(f.id==='requestForm'){await rpc('ob_request',{business_name:d.get('business_name')});toast('İşletme talebin alındı.');await route()}else if(f.id==='venueForm'){const p={id:f.dataset.id,name:d.get('name'),color:d.get('color'),review_url:d.get('review_url').trim(),tables:Number(d.get('tables'))};if(f.dataset.merchant!=='true')Object.assign(p,{sector:d.get('sector'),enabled:d.getAll('enabled'),active:d.has('active'),licensed:d.has('licensed')});await rpc(f.dataset.merchant==='true'?'ob_merchant_save':'ob_save_venue',{p});closeModal();toast('İşletme kaydedildi.');await route()}else if(f.id==='gameForm'){await rpc('ob_save_game',{p:{id:f.dataset.id,revision:Number(f.dataset.revision),name:d.get('name'),description:d.get('description'),code:d.get('code'),venue_ids:d.getAll('venue_ids'),published:d.has('published')}});closeModal();toast('Oyun kaydedildi.');await route()}else if(f.classList.contains('assignForm')){await rpc('ob_assign_account',{uid:f.dataset.id,vid:d.get('venue')||null,new_status:mode});toast('Hesap erişimi güncellendi.');await route()}}catch(err){toast(err.message)}finally{f.querySelectorAll('button').forEach(b=>b.disabled=false)}});
if(db)db.auth.onAuthStateChange(event=>{if(event==='PASSWORD_RECOVERY'){recoveryMode=true;recoveryFailure=false;setTimeout(()=>{history.replaceState(null,'',location.pathname+'?recovery=1#panel');route()},0)}if(event==='SIGNED_OUT'){me=null;adminData=null}});
route();
</script></body></html>
