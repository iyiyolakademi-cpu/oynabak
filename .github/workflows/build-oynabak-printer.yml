name: Build OynaBak Windows Printer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'OynaBakYazici/**'
      - '.github/workflows/build-oynabak-printer.yml'
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build self-contained single exe
        shell: pwsh
        run: |
          dotnet restore OynaBakYazici/OynaBakYazici.csproj --runtime win-x64
          dotnet publish OynaBakYazici/OynaBakYazici.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=false -o build/output
          if (!(Test-Path build/output/OynaBakYazici.exe)) { throw 'Executable missing' }
          (Get-FileHash build/output/OynaBakYazici.exe -Algorithm SHA256).Hash | Set-Content build/output/OynaBakYazici.sha256.txt
      - name: Upload Windows executable as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: OynaBak-Yazici-Windows-x64
          path: |
            build/output/OynaBakYazici.exe
            build/output/OynaBakYazici.sha256.txt
      - name: Publish latest test release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view windows-printer-test *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create windows-printer-test --title 'OynaBak Windows Yazıcı - Test Sürümü' --notes 'RONGTA RP330 üzerinde fiziksel kurulum ve fiş doğrulaması yapılmadan üretim kullanımı önerilmez.' --prerelease
          }
          gh release upload windows-printer-test build/output/OynaBakYazici.exe build/output/OynaBakYazici.sha256.txt --clobber