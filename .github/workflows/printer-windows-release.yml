name: Build OynaBak Windows Printer Installer

on:
  push:
    branches: [main]
    paths:
      - 'printer-agent/windows/**'
      - '.github/workflows/printer-windows-release.yml'
  pull_request:
    branches: [main]
    paths:
      - 'printer-agent/windows/**'
      - '.github/workflows/printer-windows-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish single-file standalone Windows app
        shell: pwsh
        run: |
          dotnet publish printer-agent/windows/OynaBak.Yazici.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -o dist
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
          if (-not (Test-Path 'dist/OynaBak-Yazici.exe')) { throw 'EXE missing' }

      - name: Smoke test generated executable
        shell: pwsh
        run: |
          & 'dist/OynaBak-Yazici.exe' --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Receipt self-test failed' }

      - name: Upload downloadable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OynaBak-Yazici-Windows-x64
          path: dist/OynaBak-Yazici.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable installer download
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = 'printer-windows-v1'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag 'dist/OynaBak-Yazici.exe' --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag 'dist/OynaBak-Yazici.exe' --title 'OynaBak Yazici - Windows Kurulum' --notes 'Tek dosyalik, .NET 8 self-contained Windows x64 termal yazici kurulum uygulamasi. Kurulumdan once printer-agent/windows/README.md dosyasini okuyun. Gercek RONGTA cihaz testi gereklidir.' --repo $env:GITHUB_REPOSITORY
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
