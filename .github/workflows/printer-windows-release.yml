name: Build OynaBak Windows Printer Installer

on:
  push:
    branches: [main]
    paths:
      - 'printer-agent/windows/**'
      - '.github/workflows/printer-windows-release.yml'
  pull_request:
    branches: [main]
    paths:
      - 'printer-agent/windows/**'
      - '.github/workflows/printer-windows-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish single-file standalone Windows app
        shell: pwsh
        run: |
          dotnet publish printer-agent/windows/OynaBak.Yazici.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -o dist
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
          if (-not (Test-Path 'dist/OynaBak-Yazici.exe')) { throw 'EXE missing' }

      - name: Smoke test generated executable
        shell: pwsh
        run: |
          $binary = (Resolve-Path 'dist/OynaBak-Yazici.exe').Path
          $test = Start-Process -FilePath $binary -ArgumentList '--self-test' -PassThru -Wait
          if ($test.ExitCode -ne 0) { throw "Receipt self-test failed with code $($test.ExitCode)" }

      # This is intentionally unsigned and for developer tests only.
      # Never offer it as a trusted end-user installer.
      - name: Upload downloadable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OynaBak-Yazici-UNSIGNED-TEST-ONLY
          path: dist/OynaBak-Yazici.exe
          if-no-files-found: error
          retention-days: 30

